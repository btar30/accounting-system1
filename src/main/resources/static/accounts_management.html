<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الحسابات - شجرة الحسابات</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-deep: #0b0e14;
            --bg-card: #131a26;
            --bg-input: #1b2433;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --neon-cyan: #06b6d4;
            --neon-green: #10b981;
            --neon-red: #f43f5e;
            --neon-purple: #a855f7;
            --neon-yellow: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glow: #222f45;
            --shadow-glow: 0 0 15px rgba(99, 102, 241, 0.25);
            --sidebar-width: 250px;
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --glow-cyan: 0 0 20px rgba(6, 182, 212, 0.15);
            --glow-purple: 0 0 20px rgba(168, 85, 247, 0.15);
        }

        [data-theme="light"] {
            --bg-deep: #f0f4f8;
            --bg-card: #ffffff;
            --bg-input: #f1f5f9;
            --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --neon-cyan: #0891b2;
            --neon-green: #059669;
            --neon-red: #dc2626;
            --neon-purple: #7c3aed;
            --text-main: #1e293b;
            --text-muted: #475569;
            --border-glow: #cbd5e1;
            --shadow-glow: 0 0 20px rgba(79, 70, 229, 0.15);
            --glow-cyan: 0 0 20px rgba(8, 145, 178, 0.1);
            --glow-purple: 0 0 20px rgba(124, 58, 237, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; transition: background-color 0.3s ease, border-color 0.3s ease, color 0.2s ease; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        [data-theme="dark"] .particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; pointer-events: none;
        }
        [data-theme="dark"] .particle {
            position: absolute; background: rgba(255,255,255,0.04); border-radius: 50%;
            animation: floatParticle linear infinite;
        }
        @keyframes floatParticle {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        .app-container {
            display: flex;
            gap: 12px;
            max-width: 100%;
            position: relative;
            z-index: 1;
            height: calc(100vh - 24px);
            overflow: hidden;
        }

        .sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius);
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            animation: slideDown 0.6s ease;
            backdrop-filter: blur(10px);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .sidebar-logo {
            text-align: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-glow);
            position: relative;
        }

        .sidebar-logo::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 25%;
            width: 50%;
            height: 2px;
            background: var(--primary-gradient);
            border-radius: 10px;
        }

        .sidebar-logo h2 {
            font-size: 18px;
            font-weight: 900;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .sidebar-logo p {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .sidebar-logo .developer-name {
            font-size: 9px;
            color: var(--neon-cyan);
            opacity: 0.8;
        }

        .user-session-badge {
            background: var(--bg-input);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: center;
        }
        .user-session-badge .user-name-txt {
            font-size: 12px;
            font-weight: 900;
            color: var(--text-main);
        }
        .user-session-badge .user-role-txt {
            font-size: 10px;
            font-weight: 700;
            color: var(--neon-purple);
            background: rgba(168, 85, 247, 0.1);
            padding: 2px 8px;
            border-radius: 20px;
            display: inline-block;
            margin: 0 auto;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .sidebar-nav .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 10px;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
            font-weight: 700;
            font-size: 12px;
            background: transparent;
            width: 100%;
            text-align: right;
            font-family: 'Cairo', sans-serif;
        }

        .sidebar-nav .nav-item:hover {
            background: var(--bg-input);
            color: var(--text-main);
            border-color: var(--border-glow);
            transform: translateX(-4px);
        }

        .sidebar-nav .nav-item.active {
            background: var(--primary-gradient);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            transform: translateX(-4px);
        }

        .sidebar-nav .nav-item i {
            width: 20px;
            text-align: center;
            font-size: 14px;
        }

        .sidebar-nav .nav-item .badge-count {
            margin-right: auto;
            background: rgba(255,255,255,0.1);
            padding: 1px 8px;
            border-radius: 20px;
            font-size: 10px;
        }

        .sidebar-footer {
            border-top: 1px solid var(--border-glow);
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .sidebar-footer .theme-toggle-btn {
            background: var(--bg-input);
            border: 1px solid var(--border-glow);
            border-radius: 40px;
            padding: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sidebar-footer .theme-option {
            padding: 5px 14px;
            border-radius: 35px;
            font-size: 11px;
            font-weight: 700;
            transition: var(--transition);
            cursor: pointer;
            background: transparent;
            color: var(--text-muted);
        }

        .sidebar-footer .theme-option.active {
            background: var(--primary-gradient);
            color: white;
        }

        .sidebar-footer .logout-btn {
            background: transparent;
            border: 1px solid var(--neon-red);
            color: var(--neon-red);
            padding: 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            font-family: 'Cairo', sans-serif;
        }

        .sidebar-footer .logout-btn:hover {
            background: rgba(244, 63, 94, 0.1);
            transform: translateY(-2px);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
            min-width: 0;
        }

        .company-bar {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius);
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            box-shadow: var(--shadow-glow);
        }

        .company-bar .company-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .company-bar .company-info h1 {
            font-size: 16px;
            font-weight: 900;
            color: var(--text-main);
        }

        .company-bar .company-info h1 i {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .company-bar .company-info .badge-code {
            background: var(--bg-input);
            border: 1px solid var(--border-glow);
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            color: var(--neon-cyan);
        }

        .company-bar .company-info .badge-code.id-badge {
            border-color: var(--neon-purple);
            color: var(--neon-purple);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius);
            padding: 12px 16px;
            position: relative;
            overflow: hidden;
        }

        .stat-card .label { font-size: 9px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
        .stat-card .value { font-size: 20px; font-weight: 900; font-family: monospace, 'Cairo'; margin: 3px 0; }
        .stat-card .sub { font-size: 10px; color: var(--text-muted); }
        .stat-card .stat-icon { position: absolute; top: 10px; left: 10px; font-size: 20px; opacity: 0.1; }

        .text-cyan { color: var(--neon-cyan); }
        .text-green { color: var(--neon-green); }
        .text-purple { color: var(--neon-purple); }

        .content-area {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius);
            padding: 16px;
            overflow-y: auto;
            min-height: 0;
        }

        .content-area::-webkit-scrollbar { width: 5px; }
        .content-area::-webkit-scrollbar-track { background: var(--bg-deep); border-radius: 10px; }
        .content-area::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 10px; }

        .tree-container { padding: 4px 0; }
        .tree-container ul { list-style: none; padding: 0; margin: 0; }
        .tree-container ul.tree-children {
            padding-right: 24px;
            border-right: 2px solid var(--border-glow);
            margin-right: 6px;
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 0.4s ease, opacity 0.3s ease, padding 0.3s ease;
        }
        .tree-container ul.tree-children.open {
            max-height: 5000px;
            opacity: 1;
            padding-top: 6px;
            padding-bottom: 6px;
        }

        .tree-container .tree-item-wrapper { margin-bottom: 4px; }
        .tree-container .tree-item {
            padding: 8px 14px;
            border-radius: 10px;
            background: var(--bg-input);
            border: 1px solid var(--border-glow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
        }
        .tree-container .tree-item:hover {
            border-color: var(--neon-cyan);
            box-shadow: var(--glow-cyan);
        }

        .tree-container .tree-item .tree-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .tree-container .tree-item .tree-left .toggle-icon {
            display: inline-flex; align-items: center; justify-content: center;
            width: 20px; height: 20px; border-radius: 6px;
            background: var(--bg-card); border: 1px solid var(--border-glow);
            color: var(--text-muted); font-size: 10px; cursor: pointer; transition: var(--transition);
        }
        .tree-container .tree-item .tree-left .toggle-icon:hover { background: var(--neon-cyan); color: white; }
        .tree-container .tree-item .tree-left .toggle-icon.rotated { transform: rotate(180deg); }

        .tree-container .tree-item .tree-left .account-id-badge {
            background: var(--neon-purple); color: white; padding: 1px 10px;
            border-radius: 20px; font-size: 10px; font-weight: 700; font-family: monospace;
        }

        .tree-container .tree-item .tree-left .account-code {
            font-family: monospace; font-size: 11px; color: var(--neon-cyan);
            background: var(--bg-card); padding: 1px 8px; border-radius: 4px; border: 1px solid var(--border-glow);
        }

        .type-badge { padding: 2px 8px; border-radius: 5px; font-size: 9px; font-weight: 700; }
        .badge-active, .badge-posted { background: rgba(16, 185, 129, 0.15); color: var(--neon-green); }

        .tree-actions { display: flex; gap: 4px; }
        .btn-action { padding: 3px 10px; border-radius: 6px; border: none; font-weight: 700; font-size: 9px; cursor: pointer; font-family: 'Cairo', sans-serif; display: inline-flex; align-items: center; gap: 3px; }
        .btn-add-child { background: var(--neon-green); color: white; }
        .btn-view-detail { background: var(--neon-cyan); color: white; }

        .tree-controls { display: flex; gap: 6px; }
        .btn-tree, .btn-outline-cyan-sm {
            padding: 5px 14px; border-radius: 8px; border: 1px solid var(--border-glow);
            background: var(--bg-input); color: var(--text-muted); font-weight: 700; font-size: 10px; cursor: pointer; font-family: 'Cairo', sans-serif;
            transition: var(--transition);
        }
        .btn-tree:hover, .btn-outline-cyan-sm:hover { border-color: var(--neon-cyan); color: var(--text-main); }

        .btn-export { background: var(--neon-green); color: white; border: none; padding: 5px 14px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; font-family: 'Cairo', sans-serif; }
        .btn-export-word { background: var(--neon-cyan); color: white; border: none; padding: 5px 14px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; font-family: 'Cairo', sans-serif; }

        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
        .export-actions { display: flex; gap: 4px; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
            z-index: 1000; display: none; align-items: center; justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: var(--bg-card); border: 1px solid var(--border-glow);
            border-radius: var(--radius); padding: 20px; max-width: 850px; width: 95%; max-height: 90vh; overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border-glow); }
        .modal-header h3 { margin: 0; font-size: 16px; font-weight: 900; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .modal-close { background: transparent; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; }
        .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--border-glow); }

        .alert-toast {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            padding: 10px 20px; border-radius: 10px; font-size: 12px; font-weight: 700; display: none; z-index: 2000;
        }
        .alert-success { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--neon-green); color: var(--neon-green); }
        .alert-error { background: rgba(244, 63, 94, 0.15); border: 1px solid var(--neon-red); color: var(--neon-red); }

        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; font-size: 10px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
        .modern-input, .modern-select { width: 100%; background: var(--bg-input); border: 1px solid var(--border-glow); border-radius: 8px; padding: 8px 12px; color: var(--text-main); font-family: 'Cairo', sans-serif; font-size: 12px; outline: none; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .nav-buttons-container {
            display: none; margin-top: 10px; padding: 12px 16px; background: var(--bg-input);
            border: 1px solid var(--border-glow); border-radius: var(--radius); gap: 10px; flex-wrap: wrap;
        }
        .nav-buttons-container.show { display: flex; }

        .nav-btn-link {
            padding: 8px 16px; border-radius: 10px; font-weight: 700; font-size: 12px; text-decoration: none;
            display: inline-flex; align-items: center; gap: 8px; border: none; color: white; cursor: pointer; font-family: 'Cairo', sans-serif;
            transition: var(--transition);
        }
        .nav-btn-link:hover { transform: translateY(-2px); }
        .btn-go-to-operations { background: var(--primary-gradient); }
        .btn-go-to-inventory { background: var(--neon-green); }
        .btn-back-companies { background: var(--neon-cyan); }

        @media (max-width: 992px) {
            .app-container { flex-direction: column; height: auto; }
            .sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; padding: 10px 14px; }
            .sidebar-nav { flex-direction: row; flex-wrap: wrap; flex: none; }
            .sidebar-footer { flex-direction: row; flex-wrap: wrap; }
        }
    </style>
</head>

<body>

<div id="particles" class="particles"></div>
<div id="statusToast" class="alert-toast"></div>

<div class="app-container">

    <!-- ===== Sidebar ===مودل الشريط الجانبي == -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <h2><i class="fas fa-bolt"></i> نظام فواتير المحاسبي</h2>
            <p>إدارة الحسابات</p>
            <p class="developer-name">م. اصيل فتاحي</p>
        </div>

        <div class="user-session-badge">
            <span class="user-name-txt" id="sidebarUserName"><i class="fas fa-user-circle"></i> جاري التحميل...</span>
            <span class="user-role-txt" id="sidebarUserRole">---</span>
        </div>

        <nav class="sidebar-nav">
            <button class="nav-item active" onclick="navigateTo('accounts')">
                <i class="fas fa-diagram-3"></i> الحسابات
                <span class="badge-count" id="sideAccountCount">0</span>
            </button>
        </nav>

        <div class="sidebar-footer">
            <div class="theme-toggle-btn" id="themeToggle">
                <span class="theme-option active" data-theme="dark"><i class="fas fa-moon"></i> داكن</span>
                <span class="theme-option" data-theme="light"><i class="fas fa-sun"></i> فاتح</span>
            </div>
            <button class="logout-btn" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</button>
        </div>
    </aside>

    <!-- ===== Main Content ===المحتوى الرئيسي== -->
    <main class="main-content">

        <!-- Company Bar شريط الشركة-->
        <!-- الشريط العلوي تم تنظيفه ليحتوي على اسم الشركة والكود فقط -->
        <div class="company-bar">
            <div class="company-info">
                <h1 id="lblCompanyName"><i class="fas fa-spinner fa-pulse"></i> جاري التحميل...</h1>
                <span class="badge-code" id="lblCompanyCode">الكود: ---</span>
                <span class="badge-code id-badge" id="lblCompanyId">المعرف: ---</span>
            </div>
        </div>

        <!-- Stats Grid شبكة الإحصائيات-->
        <!-- الشريط العلوي الثاني يحتوي علي اسم الشركه وعدد الحسابات الرئسيه والفرعيه التابعه لها  -->
        <div class="stats-grid">
            <div class="stat-card">
                <i class="fas fa-building stat-icon"></i>
                <div class="label">الشركة الحالية</div>
                <div class="value text-purple" id="lblCurrentCompanyName">---</div>
                <div class="sub">المختارة حالياً</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-diagram-3 stat-icon"></i>
                <div class="label">الحسابات</div>
                <div class="value text-cyan" id="lblTotalAccounts">0</div>
                <div class="sub">رئيسي + فرعي</div>
            </div>
        </div>

        <!-- أزرار الانتقال (القيود، المخازن، والعودة للشركات لمدير النظام فقط) -->
        <div id="navButtonsContainer" class="nav-buttons-container">
            <a id="btnGoToOperations" href="#" class="nav-btn-link btn-go-to-operations">
                <i class="fas fa-arrow-left"></i> القيود والتقارير
                <span class="company-tag" id="navCompanyTag1">---</span>
            </a>
            <a id="btnGoToInventory" href="#" class="nav-btn-link btn-go-to-inventory">
                <i class="fas fa-arrow-left"></i> نظام المخازن والفواتير
                <span class="company-tag" id="navCompanyTag2">---</span>
            </a>
            <!-- زر العودة للشركات يظهر لمدير النظام فقط هنا -->
            <button id="btnBackCompanies" class="nav-btn-link btn-back-companies" onclick="goBackToCompanies()" style="display: none;">
                <i class="fas fa-arrow-right"></i> العودة لقائمة الشركات
            </button>
        </div>

        <!-- مودال  الواجه الرائسيه الذي يتم فيها اضافه الحسابات وعرضها والتفاصيل  -->
        <div class="content-area">
            <div id="panelAccounts" class="tab-panel active">
                <div class="flex-between">
                    <div>
                        <button class="btn-outline-cyan-sm" onclick="openCreateAccountModal(null)"><i class="fas fa-plus"></i> إضافة حساب رئيسي</button>
                        <button class="btn-outline-cyan-sm" onclick="loadAccountTree()"><i class="fas fa-sync-alt"></i> تحديث الشجرة</button>
                    </div>
                    <div style="display: flex; gap: 6px;">
                        <div class="tree-controls">
                            <button class="btn-tree" onclick="expandAll()"><i class="fas fa-plus-circle"></i> فتح الكل</button>
                            <button class="btn-tree" onclick="collapseAll()"><i class="fas fa-minus-circle"></i> طي الكل</button>
                        </div>
                        <div class="export-actions">
                            <button class="btn-export" onclick="exportAccountsCSV()"><i class="fas fa-file-excel"></i> Excel</button>
                            <button class="btn-export-word" onclick="exportAccountsWord()"><i class="fas fa-file-word"></i> Word</button>
                        </div>
                    </div>
                </div>
                <div class="tree-container" id="accountTreeContainer">
                    <p class="text-center text-muted" style="padding: 16px;"><i class="fas fa-info-circle"></i> جاري جلب الشجرة...</p>
                </div>
            </div>
        </div>
    </main>

</div>

<!-- مودال تفاصيل الحساب -->
<div class="modal-overlay" id="accountDetailModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3><i class="fas fa-info-circle"></i> تفاصيل الحساب</h3>
            <button class="modal-close" onclick="closeModal('accountDetailModal')"><i class="fas fa-times"></i></button>
        </div>
        <div class="form-row" style="margin-bottom: 10px;">
            <div class="input-group"><label>المعرف (ID)</label><div id="detailId" style="color: var(--neon-cyan); font-weight:700;">-</div></div>
            <div class="input-group"><label>الكود</label><div id="detailCode" style="color: var(--neon-cyan); font-weight:700;">-</div></div>
        </div>
        <div class="form-row" style="margin-bottom: 10px;">
            <div class="input-group"><label>الاسم بالعربية</label><div id="detailNameAr" style="font-weight:700;">-</div></div>
            <div class="input-group"><label>الاسم بالإنجليزية</label><div id="detailNameEn" style="font-weight:700;">-</div></div>
        </div>
        <div class="form-row" style="margin-bottom: 10px;">
            <div class="input-group"><label>نوع الحساب</label><div id="detailType" style="font-weight:700;">-</div></div>
            <div class="input-group"><label>الطبيعة</label><div id="detailIsParent" style="font-weight:700;">-</div></div>
        </div>
        <div class="modal-footer">
            <button class="btn-outline-cyan-sm" onclick="closeModal('accountDetailModal')">إغلاق</button>
        </div>
    </div>
</div>

<!-- مودال إضافة الحساب -->
<div class="modal-overlay" id="accountModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3 id="accountModalTitle"><i class="fas fa-plus-circle"></i> إضافة حساب</h3>
            <button class="modal-close" onclick="closeModal('accountModal')"><i class="fas fa-times"></i></button>
        </div>
        <form id="accountForm" onsubmit="saveAccount(event)">
            <input type="hidden" id="parentAccountId">
            <div class="input-group">
                <label>اسم الحساب بالعربية <span style="color:var(--neon-red)">*</span></label>
                <input type="text" class="modern-input" id="accNameAr" required maxlength="150" placeholder="اسم الحساب">
            </div>
            <div class="input-group">
                <label>اسم الحساب بالإنجليزية</label>
                <input type="text" class="modern-input" id="accNameEn" maxlength="150" placeholder="Account name">
            </div>
            <div class="form-row">
                <div class="input-group">
                    <label>نوع الحساب <span style="color:var(--neon-red)">*</span></label>
                    <select class="modern-select" id="accountType" required>
                        <option value="ASSET">📊 الأصول</option>
                        <option value="LIABILITY">📋 الالتزامات</option>
                        <option value="EQUITY">💰 حقوق الملكية</option>
                        <option value="REVENUE">📈 الإيرادات</option>
                        <option value="EXPENSE">💸 المصروفات</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>طبيعة الحساب <span style="color:var(--neon-red)">*</span></label>
                    <select class="modern-select" id="isParent" required>
                        <option value="true">📁 حساب رئيسي</option>
                        <option value="false">📄 حساب فرعي</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-outline-cyan-sm" onclick="closeModal('accountModal')">إغلاق</button>
                <button type="submit" class="btn-outline-cyan-sm">حفظ</button>
            </div>
        </form>
    </div>
</div>

<script>
    const API_BASE = 'http://localhost:8080/api/v1';
    const token = localStorage.getItem('jwtToken');
    const userRole = String(localStorage.getItem('userRole') || '').toUpperCase();
    let currentCompanyCode = '';
    let currentCompanyData = null;
    let allAccountsData = [];

    if (!token) {
        alert('🔒 غير مصرح لك! يرجى تسجيل الدخول.');
        window.location.href = "login.html";
    }

    function displayUserInfo() {
        const username = localStorage.getItem('username') || localStorage.getItem('userName') || 'مستخدم النظام';
        const roleText = userRole.includes('ROLE_ADMIN') ? 'مدير الشركة' :
                         userRole.includes('ADMIN') ? 'مدير النظام' : (userRole || 'مستخدم');

        const nameEl = document.getElementById('sidebarUserName');
        const roleEl = document.getElementById('sidebarUserRole');

        if (nameEl) nameEl.innerHTML = `<i class="fas fa-user-circle"></i> ${username}`;
        if (roleEl) roleEl.textContent = roleText;
    }

    function initTheme() {
        const saved = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', saved);
        updateThemeButtons(saved);
        createParticles();
    }

    function updateThemeButtons(theme) {
        document.querySelectorAll('.theme-option').forEach(b => {
            b.classList.toggle('active', b.getAttribute('data-theme') === theme);
        });
    }

    function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        updateThemeButtons(theme);
        createParticles();
    }

    document.querySelectorAll('.theme-option').forEach(b => {
        b.addEventListener('click', (e) => {
            e.stopPropagation();
            setTheme(b.getAttribute('data-theme'));
        });
    });

    function createParticles() {
        const container = document.getElementById('particles');
        if (!container) return;
        container.innerHTML = '';
        if (document.documentElement.getAttribute('data-theme') !== 'dark') return;
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.classList.add('particle');
            const s = Math.random() * 4 + 2;
            p.style.cssText = `width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${Math.random()*15+10}s;animation-delay:${Math.random()*15}s;`;
            container.appendChild(p);
        }
    }

    function showToast(msg, mode = 'success') {
        const t = document.getElementById('statusToast');
        if (!t) return;
        t.innerHTML = `<i class="fas ${mode === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${msg}`;
        t.className = `alert-toast alert-${mode}`;
        t.style.display = 'block';
        clearTimeout(t._timeout);
        t._timeout = setTimeout(() => { t.style.display = 'none'; }, 3500);
    }

    function openModal(id) { document.getElementById(id).classList.add('show'); }
    function closeModal(id) { document.getElementById(id).classList.remove('show'); }

    function handleLogout() {
        if (confirm("هل تريد تسجيل الخروج؟")) {
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = "login.html";
        }
    }

    function goBackToCompanies() {
        window.location.href = 'financial_setup.html';
    }

    // إدارة الصلاحيات وظهور الأزرار
    async function initPageRoleAndCompany() {
        displayUserInfo();
        const btnBackCompanies = document.getElementById('btnBackCompanies');

        if (userRole.includes('ROLE_ADMIN')) {
            // إخفاء زر العودة للشركات لمدير الشركة
            if (btnBackCompanies) btnBackCompanies.style.display = 'none';

            const companyCodeFromStorage = localStorage.getItem('companyBusinessCode');
            if (companyCodeFromStorage) {
                await loadCompany(companyCodeFromStorage);
            } else {
                showToast('⚠️ لم يتم العثور على كود الشركة الخاصة بك', 'error');
            }
        } else {
            // إظهار زر العودة للشركات لمدير النظام
            if (btnBackCompanies) btnBackCompanies.style.display = 'inline-flex';

            const params = new URLSearchParams(window.location.search);
            const codeFromUrl = params.get('company');

            if (codeFromUrl) {
                await loadCompany(codeFromUrl);
            } else {
                const storedCode = localStorage.getItem('companyBusinessCode');
                if (storedCode) {
                    await loadCompany(storedCode);
                } else {
                    document.getElementById('lblCompanyName').innerHTML = '⚠️ لم يتم اختيار شركة';
                    document.getElementById('lblCompanyCode').innerText = '---';
                    document.getElementById('lblCompanyId').innerText = '---';
                    showToast('⚠️ الرجاء اختيار شركة', 'info');
                }
            }
        }
    }

    async function loadCompany(code) {
        currentCompanyCode = code;
        try {
            const res = await fetch(`${API_BASE}/companies/${code}`, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (!res.ok) throw new Error('الشركة غير موجودة أو تعذر الاتصال');

            const c = await res.json();
            currentCompanyData = c;

            document.getElementById('lblCompanyName').innerHTML = `🏢 ${c.nameAr || c.name}`;
            document.getElementById('lblCompanyCode').innerText = `الكود: ${c.businessCode || code}`;
            document.getElementById('lblCompanyId').innerText = `ID: ${c.id || '---'}`;
            document.getElementById('lblCurrentCompanyName').innerText = c.nameAr || c.name;

            const navContainer = document.getElementById('navButtonsContainer');
            navContainer.classList.add('show');
            document.getElementById('btnGoToOperations').href = `financial_operations.html?company=${c.businessCode || code}`;
            document.getElementById('btnGoToInventory').href = `inventory_setup.html?company=${c.businessCode || code}&name=${encodeURIComponent(c.nameAr || c.name)}`;
            document.getElementById('navCompanyTag1').textContent = c.businessCode || code;
            document.getElementById('navCompanyTag2').textContent = c.businessCode || code;

            await loadAccountTree();
            showToast(`✅ تم تحميل شركة "${c.nameAr || c.name}" بنجاح`, 'success');
        } catch (e) {
            document.getElementById('lblCompanyName').innerHTML = '⚠️ خطأ في التحميل';
            showToast('❌ ' + e.message, 'error');
        }
    }

    async function loadAccountTree() {
        if (!currentCompanyCode) return;
        try {
            const res = await fetch(`${API_BASE}/accounts/company/${currentCompanyCode}/tree`, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (!res.ok) throw new Error('فشل جلب شجرة الحسابات');
            const data = await res.json();
            allAccountsData = data;
            renderTree(data);
            const count = countAccounts(data);
            document.getElementById('lblTotalAccounts').innerText = count;
            document.getElementById('sideAccountCount').innerText = count;
        } catch (e) {
            document.getElementById('accountTreeContainer').innerHTML = `<p class="text-center" style="color:var(--neon-red); padding:16px;">${e.message}</p>`;
        }
    }

    function countAccounts(accounts) {
        if (!accounts) return 0;
        let c = accounts.length;
        accounts.forEach(a => { if (a.children) c += countAccounts(a.children); });
        return c;
    }

    function renderTree(accounts) {
        const container = document.getElementById('accountTreeContainer');
        container.innerHTML = '';
        if (!accounts || accounts.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-muted);"><i class="fas fa-inbox" style="font-size:30px; opacity:0.3; margin-bottom:8px;"></i><p>لا توجد حسابات مسجلة</p></div>`;
            return;
        }
        const ul = document.createElement('ul');
        accounts.forEach(a => ul.appendChild(createTreeNode(a, 0)));
        container.appendChild(ul);
    }

    function createTreeNode(account, level) {
        const li = document.createElement('li');
        li.className = 'tree-item-wrapper';

        const hasChildren = account.children && account.children.length > 0;
        const isParent = account.isParent || hasChildren;

        const itemDiv = document.createElement('div');
        itemDiv.className = 'tree-item';

        const leftDiv = document.createElement('div');
        leftDiv.className = 'tree-left';

        if (isParent) {
            const toggleBtn = document.createElement('span');
            toggleBtn.className = 'toggle-icon';
            toggleBtn.innerHTML = '<i class="fas fa-chevron-down"></i>';
            toggleBtn.onclick = (e) => { e.stopPropagation(); toggleNode(li); };
            leftDiv.appendChild(toggleBtn);
        }

        const idBadge = document.createElement('span');
        idBadge.className = 'account-id-badge';
        idBadge.textContent = `ID: ${account.id}`;
        leftDiv.appendChild(idBadge);

        const codeSpan = document.createElement('span');
        codeSpan.className = 'account-code';
        codeSpan.textContent = account.accountCode || '---';
        leftDiv.appendChild(codeSpan);

        const nameSpan = document.createElement('span');
        nameSpan.style.fontWeight = '700';
        nameSpan.textContent = account.nameAr;
        leftDiv.appendChild(nameSpan);

        const typeBadge = document.createElement('span');
        typeBadge.className = `type-badge ${account.isParent ? 'badge-active' : 'badge-posted'}`;
        typeBadge.textContent = account.isParent ? '📁 رئيسي' : '📄 فرعي';
        leftDiv.appendChild(typeBadge);

        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'tree-actions';

        if (isParent) {
            const addBtn = document.createElement('button');
            addBtn.className = 'btn-action btn-add-child';
            addBtn.innerHTML = '<i class="fas fa-plus"></i> فرع';
            addBtn.onclick = (e) => { e.stopPropagation(); openCreateAccountModal(account.id); };
            actionsDiv.appendChild(addBtn);
        }

        const detailBtn = document.createElement('button');
        detailBtn.className = 'btn-action btn-view-detail';
        detailBtn.innerHTML = '<i class="fas fa-info-circle"></i> تفاصيل';
        detailBtn.onclick = (e) => { e.stopPropagation(); showAccountDetail(account); };
        actionsDiv.appendChild(detailBtn);

        itemDiv.appendChild(leftDiv);
        itemDiv.appendChild(actionsDiv);
        itemDiv.onclick = (e) => { if (!e.target.closest('button')) showAccountDetail(account); };
        li.appendChild(itemDiv);

        if (hasChildren) {
            const childUl = document.createElement('ul');
            childUl.className = 'tree-children';
            if (level === 0) {
                childUl.classList.add('open');
                const toggle = li.querySelector('.toggle-icon');
                if (toggle) toggle.classList.add('rotated');
            }
            account.children.forEach(child => childUl.appendChild(createTreeNode(child, level + 1)));
            li.appendChild(childUl);
        }

        return li;
    }

    function toggleNode(li) {
        const childUl = li.querySelector('ul.tree-children');
        if (!childUl) return;
        const toggleIcon = li.querySelector('.toggle-icon');
        childUl.classList.toggle('open');
        if (toggleIcon) toggleIcon.classList.toggle('rotated');
    }

    function expandAll() {
        document.querySelectorAll('.tree-children').forEach(el => el.classList.add('open'));
        document.querySelectorAll('.toggle-icon').forEach(el => el.classList.add('rotated'));
    }

    function collapseAll() {
        document.querySelectorAll('.tree-children').forEach(el => el.classList.remove('open'));
        document.querySelectorAll('.toggle-icon').forEach(el => el.classList.remove('rotated'));
    }

    function showAccountDetail(account) {
        document.getElementById('detailId').textContent = account.id;
        document.getElementById('detailCode').textContent = account.accountCode || '---';
        document.getElementById('detailNameAr').textContent = account.nameAr;
        document.getElementById('detailNameEn').textContent = account.nameEn || '-';
        document.getElementById('detailType').textContent = account.accountType || '-';
        document.getElementById('detailIsParent').textContent = account.isParent ? '📁 رئيسي' : '📄 فرعي';
        openModal('accountDetailModal');
    }

    function openCreateAccountModal(parentId) {
        if (!currentCompanyCode) { showToast('⚠️ لا توجد شركة محددة', 'error'); return; }
        document.getElementById('accountForm').reset();
        document.getElementById('parentAccountId').value = parentId || '';
        document.getElementById('accountModalTitle').innerHTML = parentId ? '<i class="fas fa-plus-circle"></i> إضافة حساب فرعي' : '<i class="fas fa-plus-circle"></i> إضافة حساب رئيسي';
        openModal('accountModal');
    }

    async function saveAccount(e) {
        e.preventDefault();
        const parentId = document.getElementById('parentAccountId').value;
        const data = {
            nameAr: document.getElementById('accNameAr').value,
            nameEn: document.getElementById('accNameEn').value,
            accountType: document.getElementById('accountType').value,
            isParent: document.getElementById('isParent').value === 'true',
            companyBusinessCode: currentCompanyCode,
            parentAccountId: parentId ? parseInt(parentId) : null
        };

        try {
            const res = await fetch(`${API_BASE}/accounts`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify(data)
            });
            if (!res.ok) throw new Error('فشل حفظ الحساب');
            closeModal('accountModal');
            await loadAccountTree();
            showToast('✅ تم إضافة الحساب بنجاح', 'success');
        } catch (err) { showToast('❌ ' + err.message, 'error'); }
    }

    function downloadFile(content, filename, mimeType) {
        const bom = '\uFEFF';
        const blob = new Blob([bom + content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a);
    }

    function exportAccountsCSV() {
        if (!allAccountsData.length) { showToast('⚠️ لا توجد بيانات للتصدير', 'error'); return; }
        let flat = [];
        flattenList(allAccountsData, flat);
        let rows = [['المعرف', 'الكود', 'الاسم', 'النوع', 'الطبيعة']];
        flat.forEach(a => rows.push([a.id, a.accountCode || '', a.nameAr, a.accountType || '', a.isParent ? 'رئيسي' : 'فرعي']));
        downloadFile(rows.map(r => r.join(',')).join('\n'), `Accounts_${currentCompanyCode}.csv`, 'text/csv;charset=utf-8');
        showToast('✅ تم التصدير بنجاح', 'success');
    }

    function exportAccountsWord() {
        if (!allAccountsData.length) { showToast('⚠️ لا توجد بيانات للتصدير', 'error'); return; }
        let flat = [];
        flattenList(allAccountsData, flat);
        let html = `<html dir="rtl"><head><meta charset="UTF-8"><style>body{font-family:Cairo,Arial;} table{width:100%;border-collapse:collapse;} th,td{border:1px solid #999;padding:6px;text-align:right;} th{background:#333;color:#fff;}</style></head><body><h2>قائمة الحسابات - ${currentCompanyData?.nameAr || ''}</h2><table><tr><th>ID</th><th>الكود</th><th>الاسم</th><th>النوع</th><th>الطبيعة</th></tr>` +
            flat.map(a => `<tr><td>${a.id}</td><td>${a.accountCode||''}</td><td>${a.nameAr}</td><td>${a.accountType||''}</td><td>${a.isParent?'رئيسي':'فرعي'}</td></tr>`).join('') +
            `</table></body></html>`;
        downloadFile(html, `Accounts_${currentCompanyCode}.doc`, 'application/msword');
        showToast('✅ تم التصدير بنجاح', 'success');
    }

    function flattenList(list, res) {
        list.forEach(item => {
            res.push(item);
            if (item.children && item.children.length) flattenList(item.children, res);
        });
    }

    document.addEventListener('DOMContentLoaded', async () => {
        initTheme();
        await initPageRoleAndCompany();
    });
</script>

</body>
</html>
